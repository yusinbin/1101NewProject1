{{- /* 테마 404.html 덮어쓰기: 무작위 이모티콘 대신 한국어 안내와 돌아갈 길 제공 */ -}}
{{- define "title" }}
    404 페이지를 찾을 수 없음 - {{ .Site.Title -}}
{{- end -}}

{{- define "content" -}}
    <div class="page" id="content-404">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 class="error-title">페이지를 찾을 수 없어요</h1>
        <p class="error-text">주소가 바뀌었거나 잘못 입력된 것 같아요. 아래에서 이동할 곳을 골라 주세요.</p>
        <div class="error-actions">
            <a class="error-btn error-btn-primary" href="{{ "/" | relLangURL }}">홈으로</a>
            <a class="error-btn" href="{{ "/posts/" | relLangURL }}">활동 보기</a>
            <a class="error-btn" href="{{ "/about/" | relLangURL }}">소개 보기</a>
        </div>
    </div>
{{- end -}}
