    <rect width="1040" height="46" rx="18" fill="#2e1065"/>
    <rect y="28" width="1040" height="18" fill="#2e1065"/>
    <circle cx="30" cy="23" r="7" fill="#f87171"/><circle cx="54" cy="23" r="7" fill="#fbbf24"/><circle cx="78" cy="23" r="7" fill="#34d399"/>
